name: Release

on:
  push:
    tags:
      # The tags this repository actually carries have no `v` prefix (0.9.0),
      # so the commented-out 'v*' would have matched nothing had it been
      # enabled -- tdig #50 shipped that exact filter, the release never fired,
      # and #51 had to undo it.
      #
      # Enabling this does not start publishing to Hex. That stays behind the
      # publish_to_hex input, which is undefined on a tag push and therefore
      # false, so the step is skipped. The dispatch path keeps it available.
      #
      # Release tags only. A pre-release such as 0.9.0-rc1 does not match and
      # starts nothing. That is deliberate -- no repository here cuts them --
      # but it is silent, so widen this on purpose if that ever changes rather
      # than wondering why a tag did nothing.
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish_to_hex:
        description: 'Publish to Hex.pm'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        otp-version: '29.1'
        elixir-version: 'v1.20.4'
        
    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get
        
    - name: Verify mix.exs version matches the tag
      # A tag is what names the release, and everything downstream reads it:
      # the title, the archive, the `~> X.Y.Z` a consumer is told to depend on.
      # Nothing else checks that the version in mix.exs agrees, so a mistyped
      # tag would publish a release that points at a version that was never
      # cut. tdig has carried this check since #50; these three never did,
      # which went unnoticed while the workflow could not start at all.
      #
      # Runs before the tests so a wrong tag fails in seconds rather than
      # after a full build, and after the dependencies are installed because
      # mix cannot read the project config without them.
      #
      # Tag pushes only -- on a dispatch GITHUB_REF_NAME is the branch, and
      # the release step is skipped there anyway.
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        MIX_VERSION=$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])' | tail -n 1)
        TAG_VERSION="${GITHUB_REF_NAME}"
        if [ "${MIX_VERSION}" != "${TAG_VERSION}" ]; then
          echo "::error::mix.exs version (${MIX_VERSION}) does not match the tag (${TAG_VERSION})"
          exit 1
        fi
        echo "mix.exs version (${MIX_VERSION}) matches tag (${TAG_VERSION})"

    - name: Run tests
      run: mix test
      
    - name: Build docs
      run: mix docs
      
    - name: Publish to Hex
      if: ${{ inputs.publish_to_hex }}
      run: |
        mix hex.config api_key "$HEX_API_KEY"
        mix hex.publish --yes
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        
    - name: Create GitHub Release
      # Only from a tag. Everything below reads github.ref_name -- the release
      # title, the archive name, the `~> X.Y.Z` in the install snippet -- and on
      # a workflow_dispatch that is the branch, so a dispatch would publish a
      # release called "Release main" pinning a version that does not exist.
      # Guarding here leaves dispatch as a way to build and test without
      # spending a version, which is what tdig #94 added for the same reason.
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
      with:
        body: |
          ## Release ${{ github.ref_name }}
          
          ### Installation
          ```elixir
          def deps do
            [
              {:tenbin_dns, "~> ${{ github.ref_name }}"}
            ]
          end
          ```
          
          ### Documentation
          [HexDocs](https://hexdocs.pm/tenbin_dns/${{ github.ref_name }}/)
          
          ### Changes
          See [CHANGELOG.md](CHANGELOG.md) for details.
        draft: false
        prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}